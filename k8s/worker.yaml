apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: secure-ticketing
  labels:
    app.kubernetes.io/name: secure-event-ticketing
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-event-ticketing
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-event-ticketing
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ticketing-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ticketing-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ticketing-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketing-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  node -e "const {Pool}=require('pg'); const {createClient}=require('redis'); const pool=new Pool({host:process.env.POSTGRES_HOST,port:Number(process.env.POSTGRES_PORT),database:process.env.POSTGRES_DB,user:process.env.POSTGRES_USER,password:process.env.POSTGRES_PASSWORD}); const redis=createClient({socket:{host:process.env.REDIS_HOST,port:Number(process.env.REDIS_PORT)}}); Promise.all([pool.query('SELECT 1'), redis.connect().then(()=>redis.ping())]).then(()=>Promise.all([pool.end(), redis.quit()])).then(()=>process.exit(0)).catch(()=>process.exit(1));"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ps | grep '[n]ode src/worker.js'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
