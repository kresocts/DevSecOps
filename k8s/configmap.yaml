apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-config
  namespace: secure-ticketing
  labels:
    app.kubernetes.io/name: secure-event-ticketing
data:
  NODE_ENV: "production"
  POSTGRES_DB: "ticketing"
  POSTGRES_USER: "ticketing_user"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  API_PORT: "8080"
  FRONTEND_PORT: "3000"
  API_BASE_URL: "/api"
  QUEUE_NAME: "ticket_orders"
