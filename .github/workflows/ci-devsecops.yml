name: CI/CD DevSecOps

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            entrypoint: src/server.js
          - service: frontend
            entrypoint: src/server.js
          - service: worker
            entrypoint: src/worker.js
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Syntax validation
        run: node -c "${{ matrix.entrypoint }}"

      - name: Dependency audit gate
        run: npm audit --omit=dev --audit-level=high

  trivy-repository-scan:
    name: Trivy repository/IaC scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Scan Kubernetes and Docker configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: sarif
          output: reports/trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy repository report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-sarif
          path: reports/trivy-config.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload repository SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-config.sarif
          category: trivy-config

  build-scan-publish:
    name: Build, scan, optional publish ${{ matrix.service }}
    runs-on: ubuntu-24.04
    needs:
      - validate
      - trivy-repository-scan
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - frontend
          - worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          service="${{ matrix.service }}"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          image_repo="$(echo "${REGISTRY}/${GITHUB_REPOSITORY}/${service}" | tr '[:upper:]' '[:lower:]')"

          ref_name="${GITHUB_REF_NAME:-local}"
          safe_ref="$(echo "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g' | sed -E 's#^-+|-+$##g')"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            version_tag="pr-${{ github.event.pull_request.number }}-${short_sha}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version_tag="${safe_ref}"
          else
            version_tag="${safe_ref}-${short_sha}"
          fi

          echo "image_repo=${image_repo}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${image_repo}:${version_tag}" >> "${GITHUB_OUTPUT}"
          echo "sha_ref=${image_repo}:sha-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=sha-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build container image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image_ref }}" \
            -t "${{ steps.meta.outputs.sha_ref }}" \
            "./${{ matrix.service }}"

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Generate Trivy image SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: sarif
          output: reports/trivy-${{ matrix.service }}-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy image report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-image-sarif
          path: reports/trivy-${{ matrix.service }}-image.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-${{ matrix.service }}-image.sarif
          category: trivy-image-${{ matrix.service }}

      - name: Trivy image quality gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image after quality gate
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: |
          docker push "${{ steps.meta.outputs.image_ref }}"
          docker push "${{ steps.meta.outputs.sha_ref }}"
